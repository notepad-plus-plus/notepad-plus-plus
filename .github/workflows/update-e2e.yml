name: Published release updater E2E
on:
  workflow_dispatch:
    inputs:
      from-version:
        description: Published NoteQu version to install
        required: true
      to-version:
        description: Latest compatible published NoteQu version
        required: true
permissions:
  contents: read
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install independent signature verifier
        shell: bash
        run: |
          python3 -m venv .e2e-venv
          if [ -f .e2e-venv/Scripts/python.exe ]; then
            .e2e-venv/Scripts/python.exe -m pip install -r updater/signing-requirements.txt
          else
            .e2e-venv/bin/python -m pip install -r updater/signing-requirements.txt
          fi
      - name: Native application update from actual public releases
        env:
          FROM_VERSION: ${{ inputs.from-version }}
          TO_VERSION: ${{ inputs.to-version }}
        shell: bash
        run: |
          if [ -f .e2e-venv/Scripts/python.exe ]; then
            .e2e-venv/Scripts/python.exe updater/e2e_release.py --from-version "$FROM_VERSION" --to-version "$TO_VERSION" --output dist/update-e2e.json
          else
            .e2e-venv/bin/python updater/e2e_release.py --from-version "$FROM_VERSION" --to-version "$TO_VERSION" --output dist/update-e2e.json
          fi
      - name: Diagnose anonymous GitHub access after a macOS test failure
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 15 --dump-header "$headers" --output "$body" \
            --write-out '%{http_code}' --user-agent 'NoteQu-Updater' --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/berkkivircik/NoteQu/releases?per_page=100&page=1') || exit 0
          printf 'Anonymous releases API status: %s\n' "$status"
          grep -iE '^(x-ratelimit-(limit|remaining|reset|resource):|retry-after:)' "$headers" || true
          if [ "$status" = 403 ] || [ "$status" = 429 ]; then jq -r '.message // empty' "$body"; fi
          curl --silent --show-error --location --max-time 15 --output /dev/null \
            --write-out 'Public macOS manifest status: %{http_code}\n' \
            'https://github.com/berkkivircik/NoteQu/releases/latest/download/NoteQu-update-darwin-arm64.json'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: updater-e2e-${{ matrix.os }}
          path: dist/update-e2e.json
